<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uiam · 方案 D（深色科技感）</title>
<link rel="stylesheet" href="shared.css">
<style>
  :root {
    --font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --win-bg: #14161c;
    --win-radius: 11px;
    --win-shadow: 0 24px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07);
    --win-shadow-focus: 0 30px 80px rgba(0,0,0,.72), 0 0 0 1px rgba(34,211,238,.22), 0 0 40px rgba(34,211,238,.06);
    --bar-bg: #191c23;
    --bar-h: 40px;
    --t1: #e7e9ee;
    --t2: #a8afbc;
    --t3: #6c7484;
    --accent: #22d3ee;
    --accent-soft: rgba(34,211,238,.13);
    --line: rgba(255,255,255,.08);
    --line-soft: rgba(255,255,255,.045);
    --hover: rgba(34,211,238,.07);
    --side-bg: #12141a;
    --radius-sm: 7px;
  }

  /* ============ 深色底 + 光晕 ============ */
  .desktop {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 50% 40% at 16% 10%, rgba(34,211,238,.14) 0%, transparent 60%),
      radial-gradient(ellipse 45% 38% at 84% 14%, rgba(129,140,248,.15) 0%, transparent 58%),
      radial-gradient(ellipse 60% 45% at 50% 100%, rgba(59,130,246,.13) 0%, transparent 62%),
      linear-gradient(168deg, #07080b 0%, #0c0e14 40%, #10131a 70%, #0a0c11 100%);
  }
  .desktop::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 20%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 20%, transparent 78%);
  }

  /* ============ 顶部状态条 ============ */
  .statusbar {
    position: fixed; top: 0; left: 0; right: 0; height: 36px;
    display: flex; align-items: center; padding: 0 16px 0 76px;
    font-size: 12px; color: var(--t2); z-index: 9400;
    background: rgba(10,12,17,.78);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border-bottom: 1px solid rgba(255,255,255,.055);
  }
  .sb-brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; color: #f2f4f8; letter-spacing: .2px;
  }
  .sb-mark {
    width: 16px; height: 16px; border-radius: 5px;
    background: linear-gradient(135deg, #22d3ee, #3b82f6);
    display: grid; place-items: center; color: #051016;
    font-size: 8.5px; font-weight: 800;
    box-shadow: 0 0 12px rgba(34,211,238,.45);
  }
  .sb-sep { width: 1px; height: 12px; background: rgba(255,255,255,.12); margin: 0 12px; }
  .sb-app { font-size: 12px; color: var(--t2); }
  .sb-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .sb-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #5eead4;
    background: rgba(34,211,238,.1); border: 1px solid rgba(34,211,238,.2);
    padding: 2px 9px; border-radius: 20px;
  }
  .sb-pill .live { width: 5px; height: 5px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 8px #22d3ee; }
  .sb-clock { font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--t2); }
  .sb-user { display: flex; align-items: center; gap: 7px; padding: 3px 9px 3px 3px; border-radius: 20px; }
  .sb-user:hover { background: rgba(255,255,255,.06); }
  .sb-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, #22d3ee, #6366f1);
    display: grid; place-items: center; color: #06121a; font-size: 9.5px; font-weight: 700;
  }
  .sb-name { font-size: 11.5px; color: var(--t2); }

  /* ============ 左侧应用栏 ============ */
  .rail {
    position: fixed; top: 36px; left: 0; bottom: 0; width: 64px;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 4px; z-index: 9300;
    background: rgba(10,12,17,.7);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-right: 1px solid rgba(255,255,255,.055);
  }
  .rail-btn {
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center; position: relative;
    transition: background .12s;
  }
  .rail-btn:hover { background: rgba(255,255,255,.07); }
  .rail-btn .tile { width: 30px; height: 30px; border-radius: 8px; font-size: 13px; }
  .rail-btn.active { background: rgba(34,211,238,.12); }
  .rail-btn.active::before {
    content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
    width: 2.5px; height: 18px; border-radius: 2px;
    background: #22d3ee; box-shadow: 0 0 10px #22d3ee;
  }
  .rail-btn .tip {
    position: absolute; left: 48px; top: 50%; transform: translateY(-50%);
    background: #1c2029; color: #e7e9ee; font-size: 11.5px; padding: 4px 9px;
    border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none;
    border: 1px solid rgba(255,255,255,.09); transition: opacity .12s; z-index: 5;
  }
  .rail-btn:hover .tip { opacity: 1; }
  .rail-sep { width: 24px; height: 1px; background: rgba(255,255,255,.09); margin: 7px 0; }
  .rail-foot { margin-top: auto; }

  /* ============ 桌面图标 ============ */
  .desk-icons {
    position: absolute; top: 60px; left: 92px; right: 24px;
    display: grid; grid-template-columns: repeat(auto-fill, 108px);
    grid-auto-rows: 104px; gap: 6px; align-content: start; z-index: 1;
  }
  .d-icon {
    width: 108px; height: 104px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 6px;
  }
  .d-icon:hover { background: rgba(255,255,255,.055); }
  .d-icon.sel { background: rgba(34,211,238,.1); outline: 1px solid rgba(34,211,238,.35); }
  .d-icon .tile { width: 46px; height: 46px; border-radius: 12px; font-size: 19px; }
  .d-icon .lbl { font-size: 11.5px; color: #c3c9d4; text-align: center; line-height: 1.25; max-width: 96px; }
  .d-icon.sel .lbl { color: #5eead4; }

  /* ============ 深色组件覆盖 ============ */
  .window { border: none; }
  .win-bar.mini { padding: 0 8px 0 14px; }
  .win-bar.mini .win-title { font-size: 12.5px; font-weight: 600; color: #f2f4f8; }
  .win-bar.mini .wc { width: 28px; height: 26px; border-radius: 6px; }
  .win-bar.mini .wc::before, .win-bar.mini .wc::after { background: #7b8494; }
  .win-bar.mini .wc:hover { background: rgba(255,255,255,.08); }
  .win-bar.mini .wc.close:hover { background: rgba(239,68,68,.85); }
  .win-bar.mini .wc.close:hover::before, .win-bar.mini .wc.close:hover::after { background: #fff; }

  .btn {
    background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.11);
    color: var(--t1); box-shadow: none;
  }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn:active { background: rgba(255,255,255,.14); }
  .btn-primary {
    background: linear-gradient(180deg, #35dcf5, #14b8d4);
    border-color: transparent; color: #04161c; font-weight: 600;
    box-shadow: 0 0 20px rgba(34,211,238,.28);
  }
  .btn-primary:hover { filter: brightness(1.06); background: linear-gradient(180deg, #35dcf5, #14b8d4); }
  .btn-link { color: #5eead4; background: none; border: none; }
  .btn-danger-link { color: #fb7185; background: none; border: none; }

  .search {
    background-color: rgba(255,255,255,.05); border-color: rgba(255,255,255,.11);
    color: var(--t1);
  }
  .search:focus { border-color: rgba(34,211,238,.6); box-shadow: 0 0 0 3px rgba(34,211,238,.14); }

  th { background: #191c23; color: var(--t3); border-bottom-color: rgba(255,255,255,.08); }
  td { border-bottom-color: rgba(255,255,255,.045); }
  tbody tr:hover { background: rgba(34,211,238,.055); }

  .chip { background: rgba(255,255,255,.07); color: var(--t2); }
  .chip.blue { background: rgba(34,211,238,.13); color: #5eead4; }
  .chip.green { background: rgba(52,211,153,.14); color: #6ee7b7; }
  .chip.amber { background: rgba(251,191,36,.14); color: #fcd34d; }
  .chip.red { background: rgba(251,113,133,.14); color: #fda4af; }

  .dot.on { background: #34d399; box-shadow: 0 0 7px rgba(52,211,153,.7); }
  .dot.off { background: #4b5563; }

  .app-card { background: rgba(255,255,255,.028); border-color: rgba(255,255,255,.08); }
  .app-card:hover { border-color: rgba(34,211,238,.28); box-shadow: 0 0 20px rgba(34,211,238,.07); }
  .app-card .cid { background: rgba(255,255,255,.06); color: var(--t2); }

  .side-item.active { background: rgba(34,211,238,.16); color: #5eead4; }
  .side-item.active .cnt { color: rgba(94,234,212,.7); }
  .cbx { background: transparent; border-color: rgba(255,255,255,.24); }
  .cbx.on, .cbx.half { background: #14b8d4; border-color: #14b8d4; }

  .input, .select {
    background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.11);
    color: var(--t1); box-shadow: none;
  }
  .input:focus, .select:focus { border-color: rgba(34,211,238,.6); box-shadow: 0 0 0 3px rgba(34,211,238,.14); }
  .select option { background: #191c23; color: var(--t1); }

  .banner.info { background: rgba(34,211,238,.09); color: #7dd3e8; }
  .banner.warn { background: rgba(251,191,36,.1); color: #fcd34d; }

  .sec-label { border-bottom-color: rgba(255,255,255,.07); }
  .pane-title { color: #f2f4f8; }
  .win-body { background: #14161c; }
  .win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); background-clip: content-box; }
  .win-body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.26); background-clip: content-box; }
</style>
</head>
<body>

<div class="desktop">
  <div class="desk-icons" id="desk-icons"></div>
  <div class="windows" id="windows"></div>
</div>

<div class="statusbar">
  <div class="sb-brand"><span class="sb-mark">U</span>uiam</div>
  <div class="sb-sep"></div>
  <div class="sb-app" id="sb-app">工作台</div>
  <div class="sb-right">
    <div class="sb-pill"><span class="live"></span>SSO 在线</div>
    <div class="sb-clock" id="sb-clock">--</div>
    <div class="sb-user">
      <div class="sb-avatar">ZB</div>
      <div class="sb-name">张宝忠</div>
    </div>
  </div>
</div>

<div class="rail" id="rail"></div>
<div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>

<script>window.SHELL = { titlebar: 'mini' };</script>
<script src="shared.js"></script>
<script>
function renderDeskIcons() {
  document.getElementById('desk-icons').innerHTML = APPS.map(function (a) {
    return '<div class="d-icon" onclick="selIcon(this)" ondblclick="openApp(\'' + a.id + '\')">' +
      tile(a) + '<div class="lbl">' + a.name + '</div></div>';
  }).join('');
}
var selEl = null;
function selIcon(el) {
  if (selEl) selEl.classList.remove('sel');
  selEl = el; el.classList.add('sel');
}

function renderRail() {
  var apps = APPS.map(function (a) {
    return '<div class="rail-btn" data-id="' + a.id + '" onclick="openApp(\'' + a.id + '\')">' +
      tile(a) + '<div class="tip">' + a.name + '</div></div>';
  }).join('');
  document.getElementById('rail').innerHTML =
    apps + '<div class="rail-sep"></div>' +
    '<div class="rail-btn rail-foot" onclick="toast(\'系统状态正常\')">' +
      '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#6c7484" stroke-width="1.5" stroke-linecap="round">' +
        '<circle cx="10" cy="10" r="7.4"/><path d="M8 7.6a2 2 0 113 1.9c-.6.4-1 .9-1 1.6v.3"/>' +
        '<circle cx="10" cy="13.9" r=".9" fill="#6c7484" stroke="none"/></svg>' +
      '<div class="tip">帮助</div></div>';
  syncRunning();
}

function syncRunning() {
  document.querySelectorAll('.rail-btn[data-id]').forEach(function (el) {
    var id = el.dataset.id;
    el.classList.toggle('active', focusId === id && openWins[id] && !openWins[id].min);
  });
}

function onWindowFocus(id) {
  document.getElementById('sb-app').textContent = id && APP_MAP[id] ? APP_MAP[id].name : '工作台';
  syncRunning();
}

function clock() {
  var d = new Date();
  var p = function (n) { return n < 10 ? '0' + n : '' + n; };
  var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('sb-clock').textContent =
    (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + w + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

document.addEventListener('click', function (e) {
  if (!e.target.closest('.d-icon') && selEl) { selEl.classList.remove('sel'); selEl = null; }
});

renderDeskIcons();
renderRail();
clock();
setInterval(clock, 20000);
</script>
</body>
</html>
