profile = "dev"

[db]
url = "postgres://uiam:uiam@pgsql:5432/uiam"

[web]
port = 9009

# 网关管理面一期只依赖数据库与 Consul KV：
#   - 读库渲染 TOML，写库前做引用校验
#   - 发布 = PUT 到 Consul KV（网关侧不回调 uiam，这是 gatex 的铁律）
# 所以这里没有 redis / 调度器 段。
[micro-svc.consul]
base-url = "http://consul:8500"
[micro-svc.consul.registry]

# 网关配置的下发目标。与上面的 [micro-svc.consul] 是两件事：
# 上面是「uiam 自己注册到哪个 Consul」，这里是「网关的配置 TOML 写进哪个 Consul」。
# 部署上通常指向同一个 agent，但可以分开（另一个数据中心 / 另一套 ACL token）。
[consul]
base-url = "http://consul:8500"
# robotech 配置中心的 key 形态是 `{namespace}/{group}/{data_id}`，group 就是
# profile。库里 `uiam_gateway.consul_key` 存的是 data_id（`gatex-rs-svr.toml`），
# 前缀在发布时补上 → 实际写入 `dev/gatex-rs-svr.toml`。
key-prefix = "dev/"
